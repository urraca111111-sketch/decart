[build]
builder = "nixpacks"
buildCommand = "pnpm install && NODE_ENV=production pnpm --filter @workspace/decart-camera run build && pnpm --filter @workspace/api-server run build"

[deploy]
startCommand = "node --enable-source-maps artifacts/api-server/dist/index.mjs"
healthcheckPath = "/api/healthz"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
